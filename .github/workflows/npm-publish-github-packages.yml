name: Publish package

on:
  release:
    types: [created]

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
      packages: read

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: npm config set "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_READ_TOKEN }}"
      - run: pnpm install --frozen-lockfile
      - run: npm version "$RELEASE_TAG" --no-git-tag-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: pnpm run build
      # A tag carrying a prerelease suffix publishes under "next" so it never
      # displaces "latest" for consumers installing without a version.
      - run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then TAG=next; else TAG=latest; fi
          npm publish --access public --no-git-checks --tag "$TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
