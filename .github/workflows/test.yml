name: Test

on:
  pull_request:

jobs:
  test:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: npm config set "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_READ_TOKEN }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
