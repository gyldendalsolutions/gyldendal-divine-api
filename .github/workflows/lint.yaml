name: Linter

on:
  push:
  pull_request:

jobs:
  run-lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm config set "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_READ_TOKEN }}"
          pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm run lint
      - name: Run typecheck
        run: pnpm run typecheck
